name: tailscale-services

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  tailscale:
    <<: *default-logging
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TAILSCALE_HOSTNAME:-tailscale-services}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?TS_AUTHKEY must be set in .env}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---advertise-exit-node}
      # Prevent DNS deadlock/loops: daemon always resolves coordination server via host DNS
      - TS_ACCEPT_DNS=false
      # Fixed WireGuard port prevents iOS/mobile P2P connection drops across restarts
      - TS_TAILSCALED_EXTRA_ARGS=--tun=tailscale0 --port=41641
      - TZ=${TZ:-Asia/Tokyo}
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    # Least privilege: drop all Linux capabilities, grant only networking caps
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Resource constraints to prevent DoS or memory exhaustion
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    pids_limit: 256
    # BackendState check: `tailscale status` alone still exits 0 when the node is
    # logged out or its key expired, which would let dependents start with no network.
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"BackendState\":[[:space:]]*\"Running\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Fixed UDP port mapping for Tailscale WireGuard direct connections.
    # Prevents Docker from assigning random ephemeral ports on container restart,
    # eliminating the "silent blackhole" connection drop on iOS/iPadOS clients.
    ports:
      - "41641:41641/udp"
    # SECURITY NOTE: Do NOT expose internal service ports (DNS, Web UI, RustDesk) to the host interface on a public VPS.
    # Leaving internal service ports unmapped guarantees traffic is reachable ONLY via your private Tailscale network.
    # ports:
    #   - "53:53/tcp"
    #   - "53:53/udp"
    #   - "3000:3000/tcp"
    #   - "80:80/tcp"
    #   - "21115-21119:21115-21119/tcp"
    #   - "21116:21116/udp"

  adguardhome:
    <<: *default-logging
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    pids_limit: 256
    # Shares Tailscale's network namespace. AdGuard binds 0.0.0.0 inside it, so the
    # only reachable interfaces are tailscale0 and the container's bridge interface
    # (no host ports are published).
    network_mode: "service:tailscale"
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
    deploy:
      resources:
        limits:
          memory: 512M
    # No cap_drop: AdGuard binds :53/:80 and writes ./data/adguard (mode 700, owned
    # by the host user). Dropping ALL capabilities would remove DAC_OVERRIDE and
    # NET_BIND_SERVICE, so the container could neither write its volumes nor bind.
    security_opt:
      - no-new-privileges:true
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w2 127.0.0.1 53 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # RustDesk ID / Rendezvous Server
  rustdesk-hbbs:
    <<: *default-logging
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    pids_limit: 256
    network_mode: "service:tailscale"
    # -k _ enforces key authentication using the automatically generated key pair
    command: hbbs -r ${RUSTDESK_RELAY_HOST:-tailscale-services}:21117 -k _
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ./data/rustdesk:/root
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      tailscale:
        condition: service_healthy

  # RustDesk Relay Server
  rustdesk-hbbr:
    <<: *default-logging
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    pids_limit: 256
    network_mode: "service:tailscale"
    command: hbbr -k _
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ./data/rustdesk:/root
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      tailscale:
        condition: service_healthy

  # Hermes AI Agent (Autonomous Agent & Gateway)
  hermes:
    <<: *default-logging
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    pids_limit: 1024
    # SQLite state needs more than the 10s default before SIGKILL
    stop_grace_period: 30s
    command: gateway run
    network_mode: "service:tailscale"
    volumes:
      - ./data/hermes:/opt/data
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - HERMES_UID=10000
      - HERMES_GID=10000
      # LLM Provider Keys (populated via .env or configured interactively via 'hermes setup')
      - OPENAI_API_KEY=${HERMES_OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${HERMES_ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${HERMES_OPENROUTER_API_KEY:-}
      # Hermes Web Dashboard (Accessible over Tailscale at http://tailscale-services:9119)
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-true}
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?HERMES_DASHBOARD_PASSWORD must be set in .env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Remap + own /opt/data at boot: CHOWN/FOWNER/DAC_OVERRIDE for the chown,
    # SETUID/SETGID to drop to HERMES_UID. Remove them if HERMES_UID already
    # matches the owner of ./data/hermes.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      tailscale:
        condition: service_healthy
