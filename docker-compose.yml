name: tailscale-services

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  tailscale:
    <<: *default-logging
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TAILSCALE_HOSTNAME:-tailscale-services}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---advertise-exit-node}
      # Prevent DNS deadlock/loops: daemon always resolves coordination server via host DNS
      - TS_ACCEPT_DNS=false
      # Clamp MSS to PMTU prevents packet blackholes on Exit Node forwarding (PPPoE / MTU mismatch)
      - TS_TAILSCALED_EXTRA_ARGS=--tun=tailscale0
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    # Least privilege: drop all Linux capabilities, grant only networking caps
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Resource constraints to prevent DoS or memory exhaustion
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    # Health check ensuring Tailscale local daemon responds
    healthcheck:
      test: ["CMD-SHELL", "tailscale status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # SECURITY NOTE: Do NOT expose ports to the host interface on a public VPS.
    # Leaving ports unmapped guarantees traffic is reachable ONLY via your private Tailscale network.
    # ports:
    #   - "53:53/tcp"
    #   - "53:53/udp"
    #   - "3000:3000/tcp"
    #   - "80:80/tcp"
    #   - "21115-21119:21115-21119/tcp"
    #   - "21116:21116/udp"

  adguardhome:
    <<: *default-logging
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    # Shares Tailscale's network namespace (listens only on tailscale0 and localhost)
    network_mode: "service:tailscale"
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      # Ensures Watchtower safely recreates AdGuard if Tailscale is updated
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/adguardhome/AdGuardHome --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # RustDesk ID / Rendezvous Server
  rustdesk-hbbs:
    <<: *default-logging
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    network_mode: "service:tailscale"
    # -k _ enforces key authentication using the automatically generated key pair
    command: hbbs -r ${RUSTDESK_RELAY_HOST:-tailscale-services}:21117 -k _
    volumes:
      - ./data/rustdesk:/root
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      tailscale:
        condition: service_healthy

  # RustDesk Relay Server
  rustdesk-hbbr:
    <<: *default-logging
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    network_mode: "service:tailscale"
    command: hbbr -k _
    volumes:
      - ./data/rustdesk:/root
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      tailscale:
        condition: service_healthy

  # Antigravity OpenAI Bridge
  # Runs entirely inside Docker — zero processes on your Mac, zero connection to host Mac
  antigravity-proxy:
    <<: *default-logging
    image: python:3.11-alpine
    container_name: antigravity-proxy
    restart: unless-stopped
    network_mode: "service:tailscale"
    volumes:
      - ./data/antigravity:/root/.gemini/antigravity-cli:rw
      - ./antigravity_proxy.py:/app/antigravity_proxy.py:ro
    command: python3 /app/antigravity_proxy.py --host 127.0.0.1 --port 8877
    environment:
      - ANTIGRAVITY_CLIENT_ID=${ANTIGRAVITY_CLIENT_ID}
      - ANTIGRAVITY_CLIENT_SECRET=${ANTIGRAVITY_CLIENT_SECRET}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8877/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      tailscale:
        condition: service_healthy

  # Hermes AI Agent (Autonomous Agent & Gateway)
  hermes:
    <<: *default-logging
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    network_mode: "service:tailscale"
    volumes:
      - ./data/hermes:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      # LLM Provider Keys (populated via .env or configured interactively via 'hermes setup')
      - OPENAI_API_KEY=${HERMES_OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${HERMES_ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${HERMES_OPENROUTER_API_KEY:-}
      # Hermes Web Dashboard (Accessible over Tailscale at http://tailscale-services:9119)
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-true}
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:-admin}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    labels:
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      tailscale:
        condition: service_healthy

  # Automatic image updater: checks Docker Hub for updates and updates only if a new image exists
  watchtower:
    <<: *default-logging
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Explicit API version negotiation with modern Docker daemons
      - DOCKER_API_VERSION=1.45
      # Clean up old, unused image layers after updating
      - WATCHTOWER_CLEANUP=true
      # Check daily at 04:00 AM (6-field cron: sec min hour day month weekday)
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      # Handle restarting dependent containers correctly
      - WATCHTOWER_INCLUDE_RESTARTING=true
    deploy:
      resources:
        limits:
          memory: 128M

