name: tailscale-services

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TAILSCALE_HOSTNAME:-tailscale-services}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---advertise-exit-node}
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    # Least privilege: drop all Linux capabilities, grant only networking caps
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Resource constraints to prevent DoS or memory exhaustion
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    # SECURITY NOTE: Do NOT expose ports to the host interface on a public VPS.
    # Leaving ports unmapped guarantees traffic is reachable ONLY via your private Tailscale network.
    # ports:
    #   - "53:53/tcp"
    #   - "53:53/udp"
    #   - "3000:3000/tcp"
    #   - "80:80/tcp"
    #   - "21115-21119:21115-21119/tcp"
    #   - "21116:21116/udp"

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    # Shares Tailscale's network namespace (listens only on tailscale0 and localhost)
    network_mode: "service:tailscale"
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      # Ensures Watchtower safely recreates AdGuard if Tailscale is updated
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      - tailscale

  # RustDesk ID / Rendezvous Server
  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    network_mode: "service:tailscale"
    # -k _ enforces key authentication using the automatically generated key pair
    command: hbbs -r ${RUSTDESK_RELAY_HOST:-tailscale-services}:21117 -k _
    volumes:
      - ./data/rustdesk:/root
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      - tailscale

  # RustDesk Relay Server
  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    network_mode: "service:tailscale"
    command: hbbr -k _
    volumes:
      - ./data/rustdesk:/root
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      - tailscale

  # Antigravity OpenAI Bridge
  # Runs entirely inside Docker — zero processes on your Mac, zero connection to host Mac
  antigravity-proxy:
    image: python:3.11-alpine
    container_name: antigravity-proxy
    restart: unless-stopped
    network_mode: "service:tailscale"
    volumes:
      - ./data/antigravity:/root/.gemini/antigravity-cli:rw
      - ./antigravity_proxy.py:/app/antigravity_proxy.py:ro
    command: python3 /app/antigravity_proxy.py --host 127.0.0.1 --port 8877
    environment:
      - ANTIGRAVITY_CLIENT_ID=${ANTIGRAVITY_CLIENT_ID:-1071006060591-tmhssin2h21lcre235vtolojh4g403ep.apps.googleusercontent.com}
      - ANTIGRAVITY_CLIENT_SECRET=${ANTIGRAVITY_CLIENT_SECRET:-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}
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      - tailscale

  # Hermes AI Agent (Autonomous Agent & Gateway)
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    network_mode: "service:tailscale"
    volumes:
      - ./data/hermes:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      # LLM Provider Keys (populated via .env or configured interactively via 'hermes setup')
      - OPENAI_API_KEY=${HERMES_OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${HERMES_ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${HERMES_OPENROUTER_API_KEY:-}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    labels:
      - "com.centurylinklabs.watchtower.depends-on=tailscale"
    depends_on:
      - tailscale

  # Automatic image updater: checks Docker Hub for updates and updates only if a new image exists
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Explicit API version negotiation with modern Docker daemons
      - DOCKER_API_VERSION=1.45
      # Clean up old, unused image layers after updating
      - WATCHTOWER_CLEANUP=true
      # Check daily at 04:00 AM (6-field cron: sec min hour day month weekday)
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      # Handle restarting dependent containers correctly
      - WATCHTOWER_INCLUDE_RESTARTING=true
    deploy:
      resources:
        limits:
          memory: 128M

