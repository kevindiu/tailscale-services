name: tailscale-services

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  tailscale:
    <<: *default-logging
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TAILSCALE_HOSTNAME:-tailscale-services}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?TS_AUTHKEY must be set in .env}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---advertise-exit-node}
      - TS_ACCEPT_DNS=false # Prevents DNS loop deadlock with AdGuard
      - TS_TAILSCALED_EXTRA_ARGS=--tun=tailscale0 --port=41641
      - TS_SERVE_CONFIG=/config/serve.json
      - TZ=${TZ:-Asia/Tokyo}
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./config:/config:ro # Directory mount required for containerboot config watch
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - DAC_OVERRIDE # Access host-owned mode-700 ./data/tailscale on Linux
      # Add NET_BIND_SERVICE if binding port 443 in config/serve.json
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256
    restart: unless-stopped
    # Check BackendState explicitly (`tailscale status` exits 0 even when logged out)
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"BackendState\":[[:space:]]*\"Running\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Only host-mapped port: pins WireGuard UDP port to prevent iOS/mobile drops
    ports:
      - "41641:41641/udp"

  adguardhome:
    <<: *default-logging
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    network_mode: "service:tailscale"
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w2 127.0.0.1 53 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  rustdesk-hbbs:
    <<: *default-logging
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    network_mode: "service:tailscale"
    command: hbbs -r ${RUSTDESK_RELAY_HOST:-tailscale-services}:21117 -k _
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ./data/rustdesk:/root
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true

  rustdesk-hbbr:
    <<: *default-logging
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    network_mode: "service:tailscale"
    command: hbbr -k _
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ./data/rustdesk:/root
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true
      rustdesk-hbbs:
        condition: service_started

  hermes:
    <<: *default-logging
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    stop_grace_period: 30s # Clean SQLite shutdown
    command: gateway run
    network_mode: "service:tailscale"
    volumes:
      - ./data/hermes:/opt/data
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - HERMES_UID=10000
      - HERMES_GID=10000
      # Optional: inject LLM keys from .env instead of `hermes setup` (avoid empty values)
      # - OPENAI_API_KEY=${HERMES_OPENAI_API_KEY:?}
      # - ANTHROPIC_API_KEY=${HERMES_ANTHROPIC_API_KEY:?}
      # - OPENROUTER_API_KEY=${HERMES_OPENROUTER_API_KEY:?}
      - HERMES_DASHBOARD=true
      - HERMES_DASHBOARD_HOST=127.0.0.1 # Exposed via Tailscale Serve HTTPS (:9443)
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?HERMES_DASHBOARD_PASSWORD must be set in .env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Required for entrypoint chown + UID/GID drop to HERMES_UID
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 1024
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true

  immich-server:
    <<: *default-logging
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: "service:tailscale"
    volumes:
      - ${IMMICH_UPLOAD_LOCATION:-./data/immich/library}:/data
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - IMMICH_HOST=127.0.0.1 # Exposed via Tailscale Serve HTTPS (:2443)
      - IMMICH_PORT=2283
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=${IMMICH_DB_USER:-postgres}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD must be set in .env}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-immich}
      - REDIS_HOSTNAME=immich-redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 512
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy

  # Internal backends stay on the private Compose bridge (unreachable from tailscale0)
  immich-machine-learning:
    <<: *default-logging
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - ./data/immich/model-cache:/cache
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 512

  immich-redis:
    <<: *default-logging
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  immich-postgres:
    <<: *default-logging
    # Keep Postgres tag pinned to match official Immich compose (major/extension upgrades require dump/restore)
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 128mb
    volumes:
      - ./data/immich/postgres:/var/lib/postgresql/data
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - POSTGRES_USER=${IMMICH_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${IMMICH_DB_NAME:-immich}
      - POSTGRES_INITDB_ARGS=--data-checksums
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backrest:
    <<: *default-logging
    image: ghcr.io/garethgeorge/backrest:latest
    container_name: backrest
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: "service:tailscale"
    volumes:
      - ./data/backrest/data:/data
      - ./data/backrest/config:/config
      - ./data/backrest/cache:/cache
      - ./data/backrest/rclone:/root/.config/rclone # Writable so OAuth tokens (e.g. Google Drive) refresh
      - ${IMMICH_UPLOAD_LOCATION:-./data/immich/library}:/userdata/immich:ro
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - BACKREST_PORT=127.0.0.1:9898 # Exposed via Tailscale Serve HTTPS (:5443)
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9898/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
